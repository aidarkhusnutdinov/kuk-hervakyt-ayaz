<title>ultramilausha — Күк һәрвакыт аяз</title>

<!-- Пока в корне сайта ничего нет, отсюда перебрасывает на игру.
     Когда появится настоящий сайт поэтессы, он заменит собой этот файл,
     а игра останется по адресу /ayaz/ и ссылки не протухнут.

     Редирект сделан страницей, а не настройкой сервера, — чтобы работал
     на любом хостинге одинаково и не зависел от .htaccess и панели. -->
<meta http-equiv="refresh" content="0; url=/ayaz/">
<link rel="canonical" href="/ayaz/">
<script>location.replace('/ayaz/');</script>

    text-align: center;
  }
  a { color: #123; }
</style>
